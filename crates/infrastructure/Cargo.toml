[package]
name = "meeting-copilot-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "基础设施层：加密存储、审计链、检索抓取、LLM 网关、度量。"

[features]
default = ["bundled-sqlite"]
# 默认：内置 SQLite；业务载荷字段级 AES-256-GCM，FTS 索引需 sqlcipher 才能页级加密。
bundled-sqlite = ["rusqlite/bundled"]
# 页级加密：内置 SQLCipher + 随包 OpenSSL。构建机需 NASM（Windows）与 Perl/OpenSSL 构建链。
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# 阶段 D：真实 HTTPS 传输（系统 TLS，不打包 OpenSSL）。
llm-https = ["dep:native-tls"]

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
meeting-copilot-domain = { version = "0.1.3", path = "../domain" }
rusqlite = { version = "0.43" }
schemars = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde.workspace = true
sha2 = "0.10"
thiserror.workspace = true

[target."cfg(windows)".dependencies]
native-tls = { version = "0.2", optional = true }
[target."cfg(target_os = \"macos\")".dependencies]
native-tls = { version = "0.2", optional = true }

[dev-dependencies]
meeting-copilot-application = { version = "0.1.3", path = "../application" }
