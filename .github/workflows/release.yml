name: release

# 打 tag 出安装包，别人从 Releases 直接下载 exe/msi，不用装 Rust 和 Node。
# 没配 ASR_MODEL_URL 也能出包，只是包里不带识别模型，实时转写要用户自己放模型。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发版的 tag（例如 v0.1.0），需已存在"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-installer:
    name: windows installer
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows
          workspaces: ". -> target"

      - name: install frontend deps
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: install tauri cli
        run: npm install -g @tauri-apps/cli@^2 --no-audit --no-fund

      # 模型体积约 52 MB，不入库。把 zip 直链放在仓库 secret ASR_MODEL_URL 里，
      # 解压后目录名必须是 vosk-model-small-cn-0.22。
      - name: fetch asr model
        if: ${{ secrets.ASR_MODEL_URL != '' }}
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ secrets.ASR_MODEL_URL }}" -OutFile model.zip
          Expand-Archive model.zip -DestinationPath app/src-tauri/asr -Force
          if (-not (Test-Path app/src-tauri/asr/vosk-model-small-cn-0.22)) {
            throw "模型解压后目录名不是 vosk-model-small-cn-0.22"
          }

      - name: build bundles
        working-directory: app
        shell: pwsh
        run: |
          $version = "${{ inputs.tag || github.ref_name }}" -replace '^v', ''
          $arguments = @(
            "build",
            "--features", "llm-https",
            "--bundles", "nsis,msi",
            "--config", "{`"version`":`"$version`"}"
          )
          if (Test-Path "src-tauri/asr/vosk-model-small-cn-0.22") {
            $arguments += @("--config", "src-tauri/tauri.asr.conf.json")
          }
          Write-Host "tauri $($arguments -join ' ')"
          tauri @arguments

      - name: checksums
        shell: pwsh
        run: |
          $out = "target/release/bundle/SHA256SUMS.txt"
          Get-ChildItem target/release/bundle -Recurse -Include *.exe,*.msi |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Set-Content -Encoding ascii $out
          Get-Content $out

      - name: publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/SHA256SUMS.txt
          fail_on_unmatched_files: false
